# Publica Trace en GitHub Pages en cada empujón a la rama principal.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/trace-drawing-animation-app-ov7j6d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint
      - name: Construir
        # Pages sirve el proyecto bajo /<repo>/, no en la raíz del dominio.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      # Requiere que Pages esté activado en Settings -> Pages -> Source:
      # GitHub Actions. No se puede automatizar: crear el sitio pide permisos
      # de administración y el token del flujo sólo llega a escritura, así que
      # `enablement: true` responde «Resource not accessible by integration».
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
